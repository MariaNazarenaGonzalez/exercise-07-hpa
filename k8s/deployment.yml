# TODO: Deployment with 2 replicas, resource requests/limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exercise-07
  labels:
    app: exercise-07
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exercise-07
  template:
    metadata:
      labels:
        app: exercise-07 
    spec:
      containers:
        - name: api
          image: exercise-07:latest
          imagePullPolicy: Never 
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://user:pass@postgres:5432/db"
          resources:
            requests:
              cpu: "100m"      # 0.1 CPU garantizado
              memory: "128Mi"
            limits:
              cpu: "500m"      # 0.5 CPU máximo
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5